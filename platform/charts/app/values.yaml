# Team-facing values only (see values.schema.json). Platform settings are in
# templates/_platform.tpl and cannot be overridden from a service.yaml.
name: ""            # required: service name
host: ""            # required: ingress host
components: {}      # required: map of component name -> {image, tag, port, path, health, env, replicas, resources}
database:
  enabled: false
  name: api-db
  user: api-user
  password: api-password   # demo only: real setups use External Secrets / Sealed Secrets
  storage: 1Gi
smoke: []           # - {component: api, path: /hello-pg, contains: "hello world"}
