{{- if .Values.components }}
# Post-deploy verification: runs after every sync (ArgoCD PostSync hook).
# A failing Job marks the sync as failed, so a broken release is visible in Git
# history and in ArgoCD, not only to the first user who clicks a button.
apiVersion: v1
kind: ConfigMap
metadata:
  name: smoke-tests
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  smoke.hurl: |
    {{- range $name, $c0 := .Values.components }}
    {{- $c := include "app.component" (dict "root" $ "c" $c0) | fromYaml }}
    GET http://{{ $name }}{{ $c.health }}
    HTTP 200
    {{ end }}
    {{- range .Values.smoke }}
    GET http://{{ .component }}{{ .path }}
    HTTP 200
    [Asserts]
    body contains {{ .contains | quote }}
    {{ end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4        # components may still be warming up right after the sync
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: smoke
    spec:
      restartPolicy: OnFailure
      containers:
        - name: hurl
          image: ghcr.io/orange-opensource/hurl:6.1.1
          args: ["--test", "--retry", "5", "--retry-interval", "3000", "/tests/smoke.hurl"]
          volumeMounts:
            - {name: tests, mountPath: /tests}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - name: tests
          configMap:
            name: smoke-tests
{{- end }}
