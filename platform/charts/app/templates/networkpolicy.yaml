# Default deny for ingress, then explicit allows. The platform writes these,
# not the team: every exposed component accepts traffic from the ingress
# controller and from the smoke-test hook, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
{{- range $name, $c0 := .Values.components }}
{{- $c := include "app.component" (dict "root" $ "c" $c0) | fromYaml }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: smoke
      ports:
        - protocol: TCP
          port: {{ $c.port }}
{{- end }}
{{- if .Values.database.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- range $name, $c := .Values.components }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
