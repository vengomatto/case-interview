# The golden path. One list entry = one service, registered by a reviewed PR here.
# Each Application has two sources:
#   1. the platform chart (this repo)
#   2. the team's values file (the app repo, deploy/service.yaml), referenced as $values
# So the platform owns HOW things run, the team owns WHAT runs, and values.schema.json
# stops a team from overriding platform settings (quota, security context, ...).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: testkube-sample
            repoURL: https://github.com/vengomatto/testkube-samples
            revision: main
            valuesPath: deploy/service.yaml
  template:
    metadata:
      name: '{{.name}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: https://github.com/vengomatto/case-interview
          targetRevision: main
          path: platform/charts/app
          helm:
            valueFiles:
              - '$values/{{.valuesPath}}'
        - repoURL: '{{.repoURL}}'
          targetRevision: '{{.revision}}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.name}}'
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [ServerSideApply=true]
        # A release whose smoke test fails during a cold start is tried again before it is reported as failed.
        retry:
          limit: 3
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
