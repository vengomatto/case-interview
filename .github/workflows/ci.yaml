name: ci

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: A valid service renders
        run: |
          helm lint platform/charts/app -f platform/charts/app/ci/sample-service.yaml
          helm template sample platform/charts/app -n sample -f platform/charts/app/ci/sample-service.yaml > rendered.yaml
      - name: Guardrails hold (these inputs MUST be rejected)
        run: |
          for f in platform/charts/app/ci/bad-*.yaml; do
            if helm lint platform/charts/app -f "$f" > /dev/null 2>&1; then
              echo "::error::$f was accepted"; exit 1
            fi
            echo "rejected as expected: $f"
          done
      - name: Validate rendered manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas rendered.yaml
