# CI builds and verifies; it never deploys. A deploy is a reviewed PR that changes
# the image tags in services/*/service.yaml, and ArgoCD pulls it after merge.
name: ci

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci.yaml"]
  pull_request:
    paths: ["app/**", "platform/**", "services/**", ".github/workflows/ci.yaml"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/case-interview   # -> ...-api, ...-web

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test --workspace apps/api

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render every service against the platform chart
        run: |
          for f in services/*/service.yaml; do
            helm lint platform/charts/app -f "$f"
            helm template "$(basename "$(dirname "$f")")" platform/charts/app -f "$f" > /dev/null
          done

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v4
      # QEMU registers binfmt handlers so the amd64 runner can build the arm64 half.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          file: app/apps/${{ matrix.component }}/Dockerfile
          # PRs build (proves the image builds) but do not push.
          push: ${{ github.event_name == 'push' }}
          # One tag, a manifest list: the same artifact runs on amd64 nodes and on
          # arm64 (Apple Silicon laptops, Graviton). Immutable tag = commit SHA.
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  propose-deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write}
    steps:
      - uses: actions/checkout@v4
      - name: Bump image tags and open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          f=services/testkube-sample/service.yaml
          sed -i -E "s|^(    tag: ).*|\1${GITHUB_SHA}|" "$f"
          branch="deploy/${GITHUB_SHA::7}"
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore(deploy): ${GITHUB_SHA::7}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(deploy): ${GITHUB_SHA::7}" \
            --body "Image tags built from ${GITHUB_SHA}. Merge to deploy: ArgoCD pulls the change."
